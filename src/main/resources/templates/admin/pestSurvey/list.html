<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('病虫发生调查台账')"/>
</head>
<body class="pear-container">
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form" action="">
            <div class="layui-form-item">
                <label class="layui-form-label">调查单号</label>
                <div class="layui-input-inline">
                    <input type="text" name="surveyNo" placeholder="请输入调查单号关键字" class="layui-input">
                </div>
                <label class="layui-form-label">测报点编号</label>
                <div class="layui-input-inline">
                    <input type="text" name="stationCode" placeholder="请输入测报点编号关键字" class="layui-input">
                </div>
                <label class="layui-form-label">复核状态</label>
                <div class="layui-input-inline">
                    <select name="surveyStatus" class="layui-input">
                        <option value="">全部</option>
                        <option value="0">待复核</option>
                        <option value="1">已复核</option>
                    </select>
                </div>
                <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="survey-query">
                    <i class="layui-icon layui-icon-search"></i>
                    查询
                </button>
                <button type="reset" class="pear-btn pear-btn-md">
                    <i class="layui-icon layui-icon-refresh"></i>
                    重置
                </button>
            </div>
        </form>
    </div>
</div>
<div class="layui-card">
    <div class="layui-card-body">
        <table id="survey-table" lay-filter="survey-table"></table>
    </div>
</div>
</body>

<script type="text/html" id="survey-toolbar">
    <button shiro:hasPermission="pest:pestSurvey:add" class="pear-btn pear-btn-primary pear-btn-md" lay-event="add">
        <i class="layui-icon layui-icon-add-1"></i>
        新增
    </button>
    <button shiro:hasPermission="pest:pestSurvey:remove" class="pear-btn pear-btn-danger pear-btn-md" lay-event="batchRemove">
        <i class="layui-icon layui-icon-delete"></i>
        删除
    </button>
</script>

<script type="text/html" id="survey-bar">
    {{# if(d.surveyStatus == 0){ }}
    <button shiro:hasPermission="pest:pestSurvey:review" class="pear-btn pear-btn-warming pear-btn-sm" lay-event="review" title="复核">
        <i class="layui-icon layui-icon-ok-circle"></i>
    </button>
    {{# } }}
    <button shiro:hasPermission="pest:pestSurvey:edit" class="pear-btn pear-btn-primary pear-btn-sm" lay-event="edit" title="修改">
        <i class="layui-icon layui-icon-edit"></i>
    </button>
    <button shiro:hasPermission="pest:pestSurvey:remove" class="pear-btn pear-btn-danger pear-btn-sm" lay-event="remove" title="删除">
        <i class="layui-icon layui-icon-delete"></i>
    </button>
</script>

<script type="text/html" id="occur-level-tpl">
    {{# if(d.occurLevel == 1){ }}<span class="layui-badge layui-bg-green">轻</span>
    {{# } else if(d.occurLevel == 2){ }}<span class="layui-badge layui-bg-blue">中</span>
    {{# } else if(d.occurLevel == 3){ }}<span class="layui-badge" style="background-color:#FFB800">重</span>
    {{# } else if(d.occurLevel == 4){ }}<span class="layui-badge layui-bg-red">大发生</span>
    {{# } else { }}<span class="layui-badge layui-bg-gray">未定级</span>{{# } }}
</script>

<script type="text/html" id="survey-status-tpl">
    {{# if(d.surveyStatus == 1){ }}
    <span class="layui-badge layui-bg-green">已复核</span>
    {{# } else { }}
    <span class="layui-badge layui-bg-orange">待复核</span>
    {{# } }}
</script>

<th:block th:include="include :: footer"/>
<script>
    layui.use(['table', 'form', 'jquery'], function () {
        let table = layui.table;
        let form = layui.form;
        let $ = layui.jquery;

        let MODULE_PATH = rootPath + "/PestSurveyController/";
        let cols = [
            [
                {type: 'checkbox'},
                {title: 'ID', field: 'id', align: 'center', hide: true},
                {title: '调查单号', field: 'surveyNo', align: 'center', width: 150},
                {title: '测报点编号', field: 'stationCode', align: 'center', width: 130},
                {title: '分级规则', field: 'ruleCode', align: 'center', width: 110},
                {title: '病株率(%)', field: 'surveyRate', align: 'center', width: 100},
                {title: '发生程度', field: 'occurLevel', align: 'center', width: 100, templet: '#occur-level-tpl'},
                {title: '调查日期', field: 'surveyDate', align: 'center', width: 170},
                {title: '调查人', field: 'surveyBy', align: 'center', width: 110},
                {title: '复核状态', field: 'surveyStatus', align: 'center', width: 100, templet: '#survey-status-tpl'},
                {title: '备注', field: 'remark', align: 'center'},
                {title: '操作', toolbar: '#survey-bar', align: 'center', width: 140}
            ]
        ];

        table.render({
            elem: '#survey-table',
            url: MODULE_PATH + 'list',
            page: true,
            cols: cols,
            skin: 'line',
            toolbar: '#survey-toolbar',
            defaultToolbar: [{
                layEvent: 'refresh',
                icon: 'layui-icon-refresh',
            }, 'filter', 'print', 'exports']
        });

        table.on('tool(survey-table)', function (obj) {
            if (obj.event === 'remove') {
                window.remove(obj);
            } else if (obj.event === 'edit') {
                window.edit(obj);
            } else if (obj.event === 'review') {
                window.review(obj);
            }
        });

        table.on('toolbar(survey-table)', function (obj) {
            if (obj.event === 'add') {
                window.add();
            } else if (obj.event === 'refresh') {
                window.refresh();
            } else if (obj.event === 'batchRemove') {
                window.batchRemove(obj);
            }
        });

        form.on('submit(survey-query)', function (data) {
            table.reload('survey-table', {where: data.field, page: {curr: 1}});
            return false;
        });

        window.add = function () {
            layer.open({
                type: 2,
                title: '新增调查记录',
                shade: 0.1,
                area: ['640px', '620px'],
                content: MODULE_PATH + 'add'
            });
        }

        window.edit = function (obj) {
            layer.open({
                type: 2,
                title: '修改调查记录',
                shade: 0.1,
                area: ['640px', '620px'],
                content: MODULE_PATH + 'edit/' + obj.data['id']
            });
        }

        // 复核：待复核 -> 已复核
        window.review = function (obj) {
            layer.confirm('确定复核通过该调查记录吗？', {icon: 3, title: '提示'}, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: MODULE_PATH + "review",
                    data: {id: obj.data['id']},
                    dataType: 'json',
                    type: 'put',
                    success: function (result) {
                        layer.close(loading);
                        if (result.code == 200) {
                            layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                                table.reload('survey-table');
                            });
                        } else {
                            layer.msg(result.msg, {icon: 2, time: 1500});
                        }
                    }
                })
            });
        }

        window.remove = function (obj) {
            layer.confirm('确定要删除该调查记录吗？', {icon: 3, title: '提示'}, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: MODULE_PATH + "remove?ids=" + obj.data['id'],
                    dataType: 'json',
                    type: 'delete',
                    success: function (result) {
                        layer.close(loading);
                        if (result.code == 200) {
                            layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                                obj.del();
                            });
                        } else {
                            layer.msg(result.msg, {icon: 2, time: 1000});
                        }
                    }
                })
            });
        }

        window.batchRemove = function (obj) {
            let data = table.checkStatus(obj.config.id).data;
            if (data.length === 0) {
                layer.msg("未选中数据", {icon: 3, time: 1000});
                return false;
            }
            let ids = "";
            for (let i = 0; i < data.length; i++) {
                ids += data[i].id + ",";
            }
            ids = ids.substr(0, ids.length - 1);
            layer.confirm('确定要删除这些调查记录吗？', {icon: 3, title: '提示'}, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: MODULE_PATH + "remove?ids=" + ids,
                    dataType: 'json',
                    type: 'delete',
                    success: function (result) {
                        layer.close(loading);
                        if (result.code == 200) {
                            layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                                table.reload('survey-table');
                            });
                        } else {
                            layer.msg(result.msg, {icon: 2, time: 1000});
                        }
                    }
                })
            });
        }

        window.refresh = function () {
            table.reload('survey-table');
        }
    })
</script>
</html>
