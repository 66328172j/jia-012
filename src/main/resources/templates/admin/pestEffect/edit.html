<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('评估单修改')"/>
</head>
<body>
<form class="layui-form" th:object="${Effect}">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item" th:if="${locked}">
                <div class="layui-bg-gray" style="padding:10px 15px;border-left:4px solid #FFB800;color:#666;">
                    <i class="layui-icon layui-icon-auz"></i>
                    该评估单已归档锁定，内容仅供查看，不能再修改。
                </div>
            </div>
            <div class="layui-form-item layui-hide">
                <label class="layui-form-label">编号</label>
                <div class="layui-input-block">
                    <input type="text" th:value="*{id}" name="id" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">评估单号</label>
                <div class="layui-input-block">
                    <input th:value="*{effectNo}" type="text" name="effectNo" lay-verify="required" autocomplete="off" class="layui-input" th:disabled="${locked}">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">测报点</label>
                <div class="layui-input-block">
                    <select name="stationId" lay-verify="required" th:disabled="${locked}">
                        <option value="">请选择测报点</option>
                        <option th:each="s : ${stations}"
                                th:value="${s.id}"
                                th:selected="${s.id.equals(Effect.stationId)}"
                                th:text="${s.stationCode + ' / ' + s.stationName + (s.status != null && s.status == 1 ? '（已撤点）' : '')}"></option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">防治作业单</label>
                <div class="layui-input-block">
                    <select name="sprayNo" lay-verify="required" th:disabled="${locked}">
                        <option value="">请选择已完结的防治作业单</option>
                        <option th:each="sp : ${sprays}"
                                th:value="${sp.sprayNo}"
                                th:selected="${sp.sprayNo.equals(Effect.sprayNo)}"
                                th:text="${sp.sprayNo + ' / ' + (sp.pesticideName == null ? '' : sp.pesticideName) + (sp.sprayStatus != null && sp.sprayStatus == 1 ? '' : '（未完结）')}"></option>
                    </select>
                </div>
                <div class="layui-form-mid layui-word-aux">只有已完结（药液已用完）的作业单才能评估，同一作业单只允许评估一次</div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">防治前虫量</label>
                <div class="layui-input-inline">
                    <input th:value="*{beforeCount}" type="number" name="beforeCount" min="1" lay-verify="required" autocomplete="off" class="layui-input" th:disabled="${locked}">
                </div>
                <div class="layui-form-mid layui-word-aux">为0无法计算减退率，不许登记</div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">防治后虫量</label>
                <div class="layui-input-inline">
                    <input th:value="*{afterCount}" type="number" name="afterCount" min="0" lay-verify="required" autocomplete="off" class="layui-input" th:disabled="${locked}">
                </div>
                <div class="layui-form-mid layui-word-aux">虫口减退率由系统计算：<b id="rate-preview"></b></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">虫口减退率</label>
                <div class="layui-input-block">
                    <input type="text" disabled class="layui-input layui-disabled"
                           th:value="${Effect.reduceRate != null ? (Effect.reduceRate.signum() < 0 ? '异常 ' + Effect.reduceRate + '%（虫量不降反升）' : Effect.reduceRate + '%') : '未算'}">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">评估日期</label>
                <div class="layui-input-block">
                    <input type="text" name="assessDate" id="assessDate" lay-verify="required" autocomplete="off" class="layui-input"
                           th:disabled="${locked}"
                           th:value="${Effect.assessDate != null ? #dates.format(Effect.assessDate, 'yyyy-MM-dd HH:mm:ss') : ''}">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">评估人</label>
                <div class="layui-input-block">
                    <input th:value="*{assessBy}" type="text" name="assessBy" lay-verify="required" autocomplete="off" class="layui-input" th:disabled="${locked}">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">评估状态</label>
                <div class="layui-input-block">
                    <input type="text" disabled class="layui-input layui-disabled"
                           th:value="${Effect.effectStatus == 2 ? '已归档' : (Effect.effectStatus == 1 ? '已评估' : '待评估')}">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" class="layui-textarea" th:text="*{remark}" th:disabled="${locked}"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom" th:if="${!locked}">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit="" lay-filter="effect-update">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    layui.use(['form', 'jquery', 'laydate'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let laydate = layui.laydate;
        let MODULE_PATH = rootPath + "/PestEffectController";
        // 已归档锁定：原生 disabled 需重新渲染，layui 下拉才会置灰；锁定页不挂提交事件
        let locked = [[${locked}]];
        if (locked) {
            form.render();
            return;
        }

        laydate.render({
            elem: '#assessDate',
            type: 'datetime',
            format: 'yyyy-MM-dd HH:mm:ss'
        });

        // 减退率实时预览，仅用于录入提示，最终以系统保存时计算为准
        function refreshPreview() {
            let before = parseFloat($("input[name='beforeCount']").val());
            let after = parseFloat($("input[name='afterCount']").val());
            if (isNaN(before) || isNaN(after) || before <= 0) {
                $('#rate-preview').text('');
                return;
            }
            let rate = (before - after) / before * 100;
            let text = rate.toFixed(2) + '%';
            $('#rate-preview').text(rate < 0 ? text + '（虫量不降反升，将标为异常）' : text);
        }

        $("input[name='beforeCount'],input[name='afterCount']").on('input propertychange', refreshPreview);
        refreshPreview();

        form.on('submit(effect-update)', function (data) {
            $.ajax({
                url: MODULE_PATH + '/edit',
                data: data.field,
                dataType: 'json',
                type: 'post',
                success: function (result) {
                    if (result.code == 200) {
                        layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            parent.layui.table.reload("effect-table");
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 1500});
                    }
                }
            })
            return false;
        });
    })
</script>
</body>
</html>
