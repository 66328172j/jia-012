<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('分级规则新增')"/>
</head>
<body>
<form class="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item">
                <label class="layui-form-label">规则编号</label>
                <div class="layui-input-block">
                    <input type="text" name="ruleCode" lay-verify="required" autocomplete="off" placeholder="如 PG-01" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">规则名称</label>
                <div class="layui-input-block">
                    <input type="text" name="ruleName" lay-verify="required" autocomplete="off" placeholder="如 病虫发生程度分级规则" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">轻度上限(%)</label>
                <div class="layui-input-inline">
                    <input type="number" name="dev1Max" step="0.01" min="0.01" lay-verify="required" autocomplete="off" placeholder="病株率≤该值为轻" class="layui-input">
                </div>
                <div class="layui-form-mid layui-word-aux">病株率 ≤ 轻度上限 判为“轻”</div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">中度上限(%)</label>
                <div class="layui-input-inline">
                    <input type="number" name="dev2Max" step="0.01" min="0.01" lay-verify="required" autocomplete="off" placeholder="病株率≤该值为中" class="layui-input">
                </div>
                <div class="layui-form-mid layui-word-aux">轻度上限 &lt; 病株率 ≤ 中度上限 判为“中”</div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">重度上限(%)</label>
                <div class="layui-input-inline">
                    <input type="number" name="dev3Max" step="0.01" min="0.01" lay-verify="required" autocomplete="off" placeholder="病株率≤该值为重" class="layui-input">
                </div>
                <div class="layui-form-mid layui-word-aux">中度上限 &lt; 病株率 ≤ 重度上限 判为“重”，超出判为“大发生”</div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">状态</label>
                <div class="layui-input-block">
                    <select name="status">
                        <option value="0">启用</option>
                        <option value="1">停用</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" placeholder="请输入备注" class="layui-textarea"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit="" lay-filter="rule-save">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let MODULE_PATH = rootPath + "/PestRuleController";

        // 保存
        form.on('submit(rule-save)', function (data) {
            $.ajax({
                url: MODULE_PATH + '/add',
                data: data.field,
                dataType: 'json',
                type: 'post',
                success: function (result) {
                    if (result.code == 200) {
                        layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            parent.layui.table.reload("rule-table");
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 1500});
                    }
                }
            })
            return false;
        });
    })
</script>
</body>
</html>
